<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F2B4C">
    <meta name="description"
          content="Tassic — a unified life management OS: goals, music studio, recovery, fitness, faith routines, journaling and more.">
    <title>Tassic · Life OS</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tassic">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="webApp"></div>

    <div id="splash" aria-hidden="true">
        <img src="logo.png" alt="Tassic logo" draggable="false">
        <div class="wordmark">Tassic</div>
        <div class="tagline">Your Unified Life OS</div>
        <div class="spinner"></div>
    </div>

    <noscript>Tassic needs JavaScript / WebAssembly enabled to run.</noscript>

    <script src="skiko.js"></script>
    <script src="composeApp.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js', { scope: './' });
            });
        }
    </script>
</body>
</html>
