<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#BBD8EC" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F2B4C" media="(prefers-color-scheme: dark)">
    <meta name="description"
          content="Tassic — a unified life management OS: goals, music studio, recovery, fitness, faith routines, journaling and more.">
    <title>Tassic · Life OS</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tassic">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="webApp"></div>

    <div id="splash" aria-hidden="true">
        <img src="logo.png" alt="Tassic logo" draggable="false">
        <div class="wordmark">Tassic</div>
        <div class="tagline">Your Unified Life OS</div>
        <div class="spinner"></div>
    </div>

    <div id="tassic-exit-toast" aria-hidden="true">Swipe back again to exit</div>

    <noscript>Tassic needs JavaScript / WebAssembly enabled to run.</noscript>

    <script src="skiko.js"></script>
    <script src="composeApp.js"></script>
    <script>
        // ---- Service worker + offline precache -----------------------------
        // Registering alone was not enough to make the app launch offline. A
        // service worker only starts intercepting fetches once it activates and
        // claims clients, which happens well after the page has already fired
        // its own uncontrolled requests for composeApp.js / composeApp.wasm /
        // skiko.* and the content-hashed chunks around them. On a device that
        // installed the app once and was never fully reloaded online again,
        // those binaries never entered the cache at all, so the first genuinely
        // offline open sat on the splash spinner forever.
        //
        // Hardcoding filenames in sw.js can't fix that either, because webpack
        // content-hashes them. So the page reports what it *actually* loaded,
        // read straight out of Resource Timing, and the worker caches that list.
        (function () {
            if (!('serviceWorker' in navigator)) return;

            // The Resource Timing buffer defaults to 250 entries and silently
            // drops the rest - Compose resources alone can exceed that.
            try { performance.setResourceTimingBufferSize(1000); } catch (e) {}

            var registration = null;

            function reportLoadedAssets() {
                try {
                    var urls = performance.getEntriesByType('resource')
                        .map(function (entry) { return entry.name; });
                    urls.push(location.href.split('#')[0]);

                    var target = navigator.serviceWorker.controller ||
                        (registration && (registration.active || registration.waiting));
                    if (target) {
                        target.postMessage({ type: 'CACHE_URLS', urls: urls });
                    }
                } catch (e) {}
            }

            navigator.serviceWorker.register('sw.js', { scope: './' })
                .then(function (reg) {
                    registration = reg;
                    return navigator.serviceWorker.ready;
                })
                .then(function () {
                    // Immediately, then again as late-loading chunks (fonts,
                    // Compose resources, lazily fetched assets) come in.
                    reportLoadedAssets();
                    setTimeout(reportLoadedAssets, 5000);
                    setTimeout(reportLoadedAssets, 20000);
                })
                .catch(function () {});

            window.addEventListener('load', function () {
                setTimeout(reportLoadedAssets, 1500);
            });

            // Opportunistic widget refresh in the background where supported.
            navigator.serviceWorker.ready.then(function (reg) {
                if (reg.periodicSync) {
                    reg.periodicSync.register('tassic-widget-refresh', {
                        minInterval: 60 * 60 * 1000
                    }).catch(function () {});
                }
            }).catch(function () {});
        })();
    </script>

    <script>
        // ---- Splash safety net ---------------------------------------------
        // hideSplash() only runs once Compose paints. If the Wasm bundle can't
        // load (missing from cache on a cold offline start, corrupt download),
        // the user just stared at a spinner with no way out and no explanation.
        (function () {
            setTimeout(function () {
                var splash = document.getElementById('splash');
                if (!splash) return;
                var note = document.createElement('div');
                note.className = 'tagline';
                note.style.marginTop = '18px';
                note.style.maxWidth = '18rem';
                note.textContent = 'Still loading. Tap to retry - if you are offline, ' +
                    'open Tassic once with a connection to finish caching it.';
                note.style.cursor = 'pointer';
                note.onclick = function () { location.reload(); };
                splash.appendChild(note);
            }, 20000);
        })();
    </script>

    <script>
        // ---- Double-back-to-exit guard -------------------------------------
        // Only installed apps (TWA / "Add to Home Screen") get a bare back
        // gesture that closes the app on the very first swipe, because there's
        // no browser history to fall back to. A normal browser tab already has
        // real back/forward behaviour, so this only activates in standalone
        // display mode to avoid interfering with that.
        (function () {
            var isStandalone =
                window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
            if (!isStandalone) return;

            var toast = document.getElementById('tassic-exit-toast');
            var armed = false;
            var armTimer = null;

            function pushGuard() {
                history.pushState({ tassicGuard: true }, '', location.href);
            }

            function showToast() {
                toast.classList.add('visible');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(function () {
                    toast.classList.remove('visible');
                }, 1800);
            }

            // Seed one guard entry so the very first back press is
            // interceptable instead of immediately exiting.
            pushGuard();

            window.addEventListener('popstate', function () {
                if (!armed) {
                    // First back press: re-arm the guard, show the hint,
                    // and give the user ~2s to press back again to exit.
                    pushGuard();
                    showToast();
                    armed = true;
                    clearTimeout(armTimer);
                    armTimer = setTimeout(function () { armed = false; }, 2000);
                } else {
                    // Second back press within the window: let it proceed.
                    // No guard is re-pushed, so the next back genuinely exits.
                    clearTimeout(armTimer);
                }
            });
        })();
    </script>
</body>
</html>
