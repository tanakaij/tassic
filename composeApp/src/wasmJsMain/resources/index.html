<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#BBD8EC" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F2B4C" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="description"
          content="Tassic — a unified life management OS: goals, music studio, recovery, fitness, faith routines, journaling and insights.">
    <title>Tassic · Life OS</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tassic">

    <link rel="stylesheet" href="styles.css">

    <link rel="preload" href="composeApp.js" as="script">
</head>
<body>
    <div id="webApp"></div>

    <div id="splash" aria-hidden="true">
        <div class="glow"></div>
        <div class="mark">
            <img src="logo.png" alt="Tassic logo" draggable="false">
        </div>
        <div class="wordmark">Tassic</div>
        <div class="tagline">Your Unified Life OS</div>
        <div class="bar"><span></span></div>
    </div>

    <div id="tassic-exit-toast" aria-hidden="true">Swipe back again to exit</div>

    <noscript>Tassic needs JavaScript / WebAssembly enabled to run.</noscript>

    <!-- Boot diagnostics FIRST, so a failure anywhere below is visible on the
         splash instead of leaving an unexplained blank/spinning screen. -->
    <script>
        (function () {
            var shown = false;
            function show(msg) {
                try { console.error('[tassic boot]', msg); } catch (e) {}
                var splash = document.getElementById('splash');
                if (!splash || shown) return;
                shown = true;
                var box = document.createElement('div');
                box.className = 'retry';
                box.style.userSelect = 'text';
                box.innerHTML = '<b>Tassic could not start.</b><br>';
                var detail = document.createElement('div');
                detail.style.cssText = 'margin:8px 0;font:12px monospace;word-break:break-word;opacity:.85';
                detail.textContent = String(msg).slice(0, 300);
                box.appendChild(detail);
                var reload = document.createElement('button');
                reload.textContent = 'Reload';
                reload.onclick = function () { location.reload(); };
                var reset = document.createElement('button');
                reset.textContent = 'Reset app cache (keeps your data)';
                reset.style.marginLeft = '8px';
                reset.onclick = function () { window.__tassicResetCache(); };
                box.appendChild(reload);
                box.appendChild(reset);
                splash.appendChild(box);
            }
            window.addEventListener('error', function (e) {
                // Ignore failed <img>/<link> loads; only script/runtime errors matter.
                if (e && e.target && e.target !== window) return;
                show((e && e.message) || 'script error');
            });
            window.addEventListener('unhandledrejection', function (e) {
                show('Unhandled: ' + (e && e.reason && (e.reason.message || e.reason)));
            });

            // Unregisters the worker and deletes its caches. localStorage and
            // IndexedDB (the user's data) are deliberately left alone.
            window.__tassicResetCache = function () {
                var jobs = [];
                try {
                    if ('serviceWorker' in navigator) {
                        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                            return Promise.all(regs.map(function (r) { return r.unregister(); }));
                        }));
                    }
                    if ('caches' in window) {
                        jobs.push(caches.keys().then(function (keys) {
                            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                        }));
                    }
                } catch (e) {}
                Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
            };

            // Escape hatch: open the site with ?reset=1 to force a clean start.
            if (/[?&]reset=1/.test(location.search)) {
                window.__tassicResetCache();
            }
        })();
    </script>

    <script src="composeApp.js"></script>

    <script>
        // ---- Notification action queue -------------------------------------
        // The service worker handles "Mark done" / "Snooze" taps while the app
        // is closed, but a worker cannot write localStorage and the Compose app
        // cannot read the Cache API synchronously. So the worker parks actions
        // in a cache entry and this bridge moves them into localStorage, where
        // the Kotlin store drains and applies them on its next scheduler tick.
        (function () {
            var ACTIONS_URL = './__tassic/actions.json';
            var KEY = 'tassic.actionQueue';

            function append(actions) {
                if (!actions || !actions.length) return;
                var existing = [];
                try { existing = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
                if (!Array.isArray(existing)) existing = [];
                localStorage.setItem(KEY, JSON.stringify(existing.concat(actions).slice(-100)));
            }

            function drainFromCache() {
                if (!('caches' in window)) return;
                caches.match(ACTIONS_URL)
                    .then(function (res) { return res ? res.json() : null; })
                    .then(function (list) {
                        if (!list || !list.length) return;
                        append(list);
                        // Tell the worker we've taken ownership so it can clear
                        // its copy — otherwise the same action replays forever.
                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({ type: 'ACTIONS_DRAINED' });
                        }
                    })
                    .catch(function () {});
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.addEventListener('message', function (event) {
                    var msg = event.data;
                    if (msg && msg.type === 'TASSIC_ACTION' && msg.action) {
                        append([msg.action]);
                    }
                });
            }

            drainFromCache();
            // Re-drain when the app comes back to the foreground: this is the
            // moment a user who just tapped a notification arrives back here.
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) drainFromCache();
            });
            window.addEventListener('focus', drainFromCache);
        })();
    </script>

    <script>
        // ---- Service worker + offline precache -----------------------------
        // Registering alone is not enough to make the app launch offline. A
        // worker only starts intercepting fetches once it activates and claims
        // clients, which happens well after the page has already fired its own
        // uncontrolled requests for composeApp.js / composeApp.wasm / skiko.*
        // and the content-hashed chunks around them. Hardcoding filenames in
        // sw.js can't fix that either, because webpack content-hashes them —
        // so the page reports what it actually loaded, read straight out of
        // Resource Timing, and the worker caches that list.
        (function () {
            if (!('serviceWorker' in navigator)) return;

            // The Resource Timing buffer defaults to 250 entries and silently
            // drops the rest — Compose resources alone can exceed that.
            try { performance.setResourceTimingBufferSize(1000); } catch (e) {}

            var registration = null;

            function reportLoadedAssets() {
                try {
                    var urls = performance.getEntriesByType('resource')
                        .map(function (entry) { return entry.name; });
                    urls.push(location.href.split('#')[0]);

                    var target = navigator.serviceWorker.controller ||
                        (registration && (registration.active || registration.waiting));
                    if (target) {
                        target.postMessage({ type: 'CACHE_URLS', urls: urls });
                    }
                } catch (e) {}
            }

            function registerBackgroundDelivery(reg) {
                // Periodic background sync is the only primitive that lets a
                // backend-less PWA be woken later to deliver a reminder. It's
                // gated on install + engagement and unavailable on some
                // platforms, which the Settings → Diagnostics panel reports.
                try {
                    if (reg.periodicSync) {
                        reg.periodicSync.register('tassic-reminders', {
                            minInterval: 30 * 60 * 1000
                        }).catch(function () {});
                        reg.periodicSync.register('tassic-widget-refresh', {
                            minInterval: 60 * 60 * 1000
                        }).catch(function () {});
                    }
                    if (reg.sync) {
                        reg.sync.register('tassic-catchup').catch(function () {});
                    }
                } catch (e) {}
            }

            // Registered after `load`, so worker install/precache traffic can
            // never compete with the Wasm bundle for bandwidth on first boot.
            function registerWorker() {
                navigator.serviceWorker.register('sw.js', { scope: './' })
                    .then(function (reg) {
                        registration = reg;
                        return navigator.serviceWorker.ready;
                    })
                    .then(function (reg) {
                        reportLoadedAssets();
                        setTimeout(reportLoadedAssets, 5000);
                        setTimeout(reportLoadedAssets, 20000);
                        registerBackgroundDelivery(reg);
                        // Ask the worker to catch up on anything that fell due
                        // while the app was closed.
                        var target = reg.active || navigator.serviceWorker.controller;
                        if (target) target.postMessage({ type: 'CHECK_REMINDERS' });
                    })
                    .catch(function () {});
            }

            if (document.readyState === 'complete') registerWorker();
            else window.addEventListener('load', registerWorker);

            window.addEventListener('load', function () {
                setTimeout(reportLoadedAssets, 1500);
            });
        })();
    </script>

    <script>
        // ---- Splash safety net ---------------------------------------------
        // hideSplash() only runs once Compose paints. If the Wasm bundle can't
        // load (missing from cache on a cold offline start, corrupt download),
        // the user otherwise just stares at a spinner with no way out.
        (function () {
            setTimeout(function () {
                var splash = document.getElementById('splash');
                if (!splash) return;
                var note = document.createElement('div');
                note.className = 'retry';
                note.textContent = 'Still loading. Tap to retry — if you are offline, ' +
                    'open Tassic once with a connection to finish caching it.';
                note.onclick = function () { location.reload(); };
                splash.appendChild(note);
            }, 20000);
        })();
    </script>

    <script>
        // ---- Double-back-to-exit guard -------------------------------------
        // Only installed apps get a bare back gesture that closes the app on the
        // first swipe, because there's no browser history to fall back on. A
        // normal tab already has real back/forward behaviour, so this only
        // activates in standalone display mode.
        (function () {
            var isStandalone =
                window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
            if (!isStandalone) return;

            var toast = document.getElementById('tassic-exit-toast');
            var armed = false;
            var armTimer = null;

            function pushGuard() {
                history.pushState({ tassicGuard: true }, '', location.href);
            }

            function showToast() {
                toast.classList.add('visible');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(function () {
                    toast.classList.remove('visible');
                }, 1800);
            }

            pushGuard();

            window.addEventListener('popstate', function () {
                if (!armed) {
                    pushGuard();
                    showToast();
                    armed = true;
                    clearTimeout(armTimer);
                    armTimer = setTimeout(function () { armed = false; }, 2000);
                } else {
                    clearTimeout(armTimer);
                }
            });
        })();
    </script>
</body>
</html>
