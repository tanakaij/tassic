name: Tassic · Deploy PWA + Build Android TWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tassic-deploy
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------------ Web (PWA)
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          cache-read-only: false
      - name: Compile Wasm app
        run: gradle :composeApp:wasmJsBrowserDistribution --no-daemon
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # ------------------------------------------------------- Android TWA (Bubblewrap)
  android-twa:
    needs: deploy-pages
    runs-on: ubuntu-latest
    env:
      # Bubblewrap reads passwords from these exact env var names (not arbitrary ones) —
      # setting them makes `bubblewrap build` skip its interactive password prompts entirely.
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'tassic123' }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'tassic123' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (bubblewrap requires 17, not 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Point TWA manifest at this repo's Pages URL
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s/__OWNER__/${OWNER}/g; s|/Tassic/|/${REPO}/|g" twa-manifest.json

      - name: Restore or create signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "Using keystore from secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > tassic-release.jks
          else
            echo "No ANDROID_KEYSTORE_B64 secret — generating a fresh keystore"
            keytool -genkeypair -v -keystore tassic-release.jks -alias tassic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=Tassic, OU=Mobile, O=Tassic, L=Internet, S=Internet, C=US"
          fi

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip interactive JDK/SDK wizard)
        run: |
          if [ -z "$JAVA_HOME" ] || [ -z "$ANDROID_HOME" ]; then
            echo "::error::JAVA_HOME or ANDROID_HOME is empty — cannot pre-configure Bubblewrap."
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Wrote config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make Bubblewrap recognize the pre-installed Android SDK
        # Bubblewrap only accepts an SDK path if it contains a top-level `tools/` or
        # `bin/` folder (see AndroidSdkTools.validatePath in @bubblewrap/core). GitHub's
        # runner image only has cmdline-tools/latest/bin, which Bubblewrap doesn't look
        # in, so `bubblewrap build` fails with "The provided androidSdk isn't correct"
        # even though ANDROID_HOME is set correctly. Symlinking the tools into
        # $ANDROID_HOME/bin satisfies both the validation check and the paths Bubblewrap
        # later uses to locate sdkmanager (ANDROID_HOME/bin/sdkmanager).
        run: |
          mkdir -p "$ANDROID_HOME/bin"
          ln -sf "$ANDROID_HOME"/cmdline-tools/latest/bin/* "$ANDROID_HOME/bin/"
          ls -la "$ANDROID_HOME/bin"

      - name: Generate/refresh the Android TWA project (non-interactive)
        # `update` builds the project + manifest-checksum.txt directly, with no
        # confirmation prompts. Running this first means the later `build` step
        # finds a matching checksum and skips its "apply changes?" prompts too.
        run: bubblewrap update --manifest="$(pwd)/twa-manifest.json" --skipVersionUpgrade

      - name: Build signed APK & AAB
        run: bubblewrap build --manifest="$(pwd)/twa-manifest.json" --skipVersionUpgrade

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tassic-android-twa
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
